name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cold-install:
    name: Cold install + run (no HF token, clean machine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install boxdawn with detect extras (cold, no cache)
        run: pip install ".[detect]"
      - name: Run boxdawn analyze without HF token
        env:
          HF_TOKEN: ""
          HUGGINGFACE_HUB_TOKEN: ""
        run: |
          boxdawn analyze examples/sample_otel_trace.json | tee /tmp/report.txt
          echo "exit code: ${PIPESTATUS[0]}"
      - name: Assert report produced
        run: |
          grep -q "Boxdawn Waste Report" /tmp/report.txt || (echo "report generation failed" && exit 1)
          echo "cold start OK: install + run + report with no token"

  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with dev + detect
        run: pip install ".[detect,dev]"
      # Lint before the suite: a syntax error or an undefined name is cheaper to
      # read from ruff than from a collection error six minutes in. `F` and `E9`
      # only -- the selection and the reasons for what is left out are in
      # pyproject.toml.
      - name: Lint (ruff)
        run: ruff check
      - name: Run pytest
        run: pytest -q

  tests-windows:
    name: Test suite (Windows)
    # The suite has a Windows-only test and it has never run anywhere. `schtasks
    # /XML` reads UTF-16 and rejects a UTF-8 file as malformed, which would leave
    # the sweep unregistered while `install` reported it as an XML problem --
    # that is what the test distinguishes, and on ubuntu it is skipped, so the
    # guard has been passing by not running since the day it was written.
    #
    # It also matters that the whole suite runs here: this is the only platform
    # the scheduler, the paths and the file locking are written for, and every
    # measurement in docs/ was produced on it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with dev + detect
        run: pip install ".[detect,dev]"
      - name: Lint (ruff)
        run: ruff check
      - name: Run pytest
        run: pytest -q
