[project]
name = "boxdawn"
version = "0.5.5"
description = "Boxdawn — AI agent observability. Detect waste in multi-agent traces."
authors = [{ name = "Boxdawn" }]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = [
    "agent",
    "observability",
    "llm",
    "tokens",
    "waste",
    "tracing",
    "opentelemetry",
    "claude-code",
    "cost",
    "deterministic",
]
requires-python = ">=3.12"
# The MIT classifier was present and the License metadata field was empty, so
# tools that read the field rather than the classifiers saw no license at all.
# Table form rather than a PEP 639 SPDX string because the build pin below is
# setuptools<75 and the string form needs 77 or newer.
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Token counting for context_resend + redundant_read, both of which run
    # unconditionally in `boxdawn analyze` (__main__.py:246, :251). Undeclared
    # until 0.5.1: every clean install fell back to len(text)//4 while our own
    # environment happened to have tiktoken, so published token and cost
    # figures did not reproduce for users. Base, not an extra, because the
    # analyze path always needs it.
    #
    # Not exact-pinned: reproducibility rests on the encoding name, which is
    # frozen in code (context_resend.py :: _chunk_token_len, "frozen for v1"),
    # not on the package version. The range only guarantees availability.
    "tiktoken>=0.7,<1.0",
]

[project.optional-dependencies]
adapter = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
]
detect = [
    # 경량 탐지: tool 반복/재조회 (sha256 구조 게이트).
    # structural.py / cascade.py 는 stdlib + base pydantic 만 사용 → 추가 패키지 0.
    # extra 이름 유지 (v0.1.x 명명 일관성), 의미 재정의: 무거운 스택은 [semantic]로 이동.
]
semantic = [
    # LLM/chain 노드 재작성 중복 (cos >= phi) — 의미 게이트 활성화 시에만 필요.
    # reproducibility freeze: SHA verified reproducible on this version set (stage18 release prep).
    "sentence-transformers==5.5.1",
    "transformers==5.0.0",
    "torch>=2.0",
    "huggingface_hub>=0.20",
]
judge = [
    # LLM-as-judge Semantic Duplicate detector (opt-in). Only needed
    # when CLEW_ENABLE_LLM_JUDGE=1 or --llm-judge is passed.
    "anthropic>=0.30",
]
dev = [
    "pytest>=8.0",
]
all = [
    "boxdawn[detect,semantic,adapter,judge]",
]

[project.urls]
# Homepage points at the product, not at this repository. PyPI renders these
# links on the project page and piwheels mirrors the same metadata, so between
# them they are the highest-authority description of what Boxdawn is -- and
# with Homepage aimed at GitHub, both were saying "this is a repository" and
# neither carried a link to the service at all. Repository keeps the code.
Homepage = "https://boxdawn.com"
Documentation = "https://boxdawn.com/product"
Repository = "https://github.com/boxdawn/boxdawn"
Issues = "https://github.com/boxdawn/boxdawn/issues"

[project.scripts]
boxdawn = "clew.__main__:main"

[build-system]
requires = ["setuptools>=61,<75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
