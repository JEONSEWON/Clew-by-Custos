[project]
name = "clew-custos"
version = "0.1.0"
description = "Detect wasteful cycles in multi-agent traces (Custos / Clew, S0 MVP)."
authors = [{ name = "Custos" }]
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
adapter = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
]
detect = [
    # 재현성 동결: 이 버전 조합에서 SHA 재현 검증됨 (stage18 배포준비).
    "sentence-transformers==5.5.1",
    "transformers==5.0.0",
    "torch>=2.0",
    "huggingface_hub>=0.20",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/JEONSEWON/Clew-by-Custos"
Repository = "https://github.com/JEONSEWON/Clew-by-Custos"

[project.scripts]
clew = "clew.__main__:main"

[build-system]
requires = ["setuptools>=61,<75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
