[project]
name = "clew-custos"
version = "0.1.0"
description = "Detect wasteful cycles in multi-agent traces (Custos / Clew, S0 MVP)."
authors = [{ name = "Custos" }]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = [
    "agent",
    "observability",
    "llm",
    "tokens",
    "waste",
    "tracing",
    "opentelemetry",
    "claude-code",
    "cost",
    "deterministic",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
adapter = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
]
detect = [
    # reproducibility freeze: SHA verified reproducible on this version set (stage18 release prep).
    "sentence-transformers==5.5.1",
    "transformers==5.0.0",
    "torch>=2.0",
    "huggingface_hub>=0.20",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/JEONSEWON/Clew-by-Custos"
Repository = "https://github.com/JEONSEWON/Clew-by-Custos"
Issues = "https://github.com/JEONSEWON/Clew-by-Custos/issues"

[project.scripts]
clew = "clew.__main__:main"

[build-system]
requires = ["setuptools>=61,<75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
