[project]
name = "boxdawn"
version = "0.5.7"
description = "Boxdawn — AI agent observability. Detect waste in multi-agent traces."
authors = [{ name = "Boxdawn" }]
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = [
    "agent",
    "observability",
    "llm",
    "tokens",
    "waste",
    "tracing",
    "opentelemetry",
    "claude-code",
    "cost",
    "deterministic",
]
requires-python = ">=3.12"
# The MIT classifier was present and the License metadata field was empty, so
# tools that read the field rather than the classifiers saw no license at all.
# Table form rather than a PEP 639 SPDX string because the build pin below is
# setuptools<75 and the string form needs 77 or newer.
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Token counting for context_resend + redundant_read, both of which run
    # unconditionally in `boxdawn analyze` (__main__.py:246, :251). Undeclared
    # until 0.5.1: every clean install fell back to len(text)//4 while our own
    # environment happened to have tiktoken, so published token and cost
    # figures did not reproduce for users. Base, not an extra, because the
    # analyze path always needs it.
    #
    # Not exact-pinned: reproducibility rests on the encoding name, which is
    # frozen in code (context_resend.py :: _chunk_token_len, "frozen for v1"),
    # not on the package version. The range only guarantees availability.
    "tiktoken>=0.7,<1.0",
]

[project.optional-dependencies]
adapter = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "openinference-instrumentation-langchain>=0.1",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
]
detect = [
    # 경량 탐지: tool 반복/재조회 (sha256 구조 게이트).
    # structural.py / cascade.py 는 stdlib + base pydantic 만 사용 → 추가 패키지 0.
    # extra 이름 유지 (v0.1.x 명명 일관성), 의미 재정의: 무거운 스택은 [semantic]로 이동.
]
semantic = [
    # LLM/chain 노드 재작성 중복 (cos >= phi) — 의미 게이트 활성화 시에만 필요.
    # reproducibility freeze: SHA verified reproducible on this version set (stage18 release prep).
    "sentence-transformers==5.5.1",
    "transformers==5.0.0",
    "torch>=2.0",
    "huggingface_hub>=0.20",
]
judge = [
    # LLM-as-judge Semantic Duplicate detector (opt-in). Only needed
    # when CLEW_ENABLE_LLM_JUDGE=1 or --llm-judge is passed.
    #
    # Upper bound, not decoration. `anthropic` 1.x removed `temperature`
    # from `Messages.create()`, and both judges pass `temperature=0.0`
    # (verification_judge.py, anthropic_client.py). Without the bound a
    # clean install resolves 1.x and every judged trace comes back
    # `not_judged: "the judge did not answer"` -- an error path that reads
    # exactly like "there was nothing to judge". Measured on a live Modal
    # container 2026-09-03: anthropic 1.3.0, TypeError on the kwarg.
    #
    # 0.x is also the version every published precision figure was measured
    # on, and `temperature=0` is stated in the shipped report text and
    # frozen by the judge prereg §3. Moving to 1.x is an amendment, not an
    # upgrade.
    "anthropic>=0.30,<1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.16",
]
all = [
    "boxdawn[detect,semantic,adapter,judge]",
]

[project.urls]
# Homepage points at the product, not at this repository. PyPI renders these
# links on the project page and piwheels mirrors the same metadata, so between
# them they are the highest-authority description of what Boxdawn is -- and
# with Homepage aimed at GitHub, both were saying "this is a repository" and
# neither carried a link to the service at all. Repository keeps the code.
Homepage = "https://boxdawn.com"
Documentation = "https://boxdawn.com/product"
Repository = "https://github.com/boxdawn/boxdawn"
Issues = "https://github.com/boxdawn/boxdawn/issues"

[project.scripts]
boxdawn = "clew.__main__:main"

[build-system]
requires = ["setuptools>=61,<75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

# ---------------------------------------------------------------------
# ruff — introduced 2026-09-01, and deliberately narrow.
#
# `F` (pyflakes) and `E9` (syntax and IO errors) only. Those are the rules that
# find code that is wrong rather than code that is unfashionable: an unused
# import, an undefined name, an f-string with no placeholder, a variable
# assigned and never read. `src/` and `tests/` are clean under them as of this
# commit, which is why the selection is a gate rather than a wish.
#
# Everything else is left off on purpose. A wider default found about 110 more
# in `src/` alone -- quoted annotations, import order, blind excepts -- and most
# of those are choices this codebase made deliberately and documents in
# comments. Turning them on would mean 110 diffs nobody asked for and a habit of
# ignoring the linter.
#
# ★ `RUF100` (unused noqa) is excluded, and that is not an oversight. With a
# narrow selection it reports every `# noqa` for a rule we have not enabled --
# `non-enabled: F401`, `non-enabled: PLC0415` -- and "fixing" those deletes
# suppressions that exist for rules we may enable later. It becomes safe to
# enable only alongside the rules those directives name.
#
# `field_test/diagnostics/` is excluded: those are uncommitted probes by
# convention, and they carry 283 of these on their own.
[tool.ruff]
target-version = "py312"   # matches requires-python = ">=3.12"
line-length = 100
extend-exclude = ["field_test/diagnostics", "eval", "data"]

[tool.ruff.lint]
select = ["F", "E9"]

# `field_test/` (outside diagnostics) holds committed research scripts that
# produced published numbers. They are not edited to satisfy a linter
# introduced years later, so two rules are off there:
#
#   F841  seven unused locals, all cosmetic.
#   F821  two hits in `recon_bash.py`, and both are false positives. `df` is a
#         closure variable that a `del df` later in the same scope unbinds;
#         every call to the nested function happens before the `del`, so the
#         code is correct and ruff is reading scope without order.
#
# ★ Recorded because the first reading of those two was "ruff found real bugs".
# The other apparent find, an f-string backslash flagged as invalid syntax, was
# our own misconfiguration: `target-version` was set to py310 while
# `requires-python` is >=3.12, where that syntax is legal. Acting on it would
# have damaged working code to satisfy a setting we got wrong.
[tool.ruff.lint.per-file-ignores]
"field_test/*.py" = ["F841", "F821"]
